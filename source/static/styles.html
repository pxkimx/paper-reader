<!doctype html>
<html lang="en">
<head>
<script src="/static/frame.js"></script>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Paper Reader Styles</title>
<script src="/static/themes.js"></script>
<script>
  (function () { var t = "notebook"; try { t = JSON.parse(localStorage.getItem("pr.theme")) || t; } catch (e) {}
    document.documentElement.dataset.defaultTheme = t === "dark" || t === "deco" ? "dark" : "light"; })();
</script>
<script src="/static/theme-switch.js"></script>
<style>
  :root { --ink: #1d1f23; --muted: #6b707a; --line: #e3e4e8; --bg: #f4f5f7; --accent: #2b5fd9;
    --head: rgba(244,245,247,.92); --seg: #e6e8ec; --seg-on: #fff; --surface: #fff; --shot: #eee; --chosen: #e8eefc; color-scheme: light; }
  :root[data-theme="dark"] { --ink: #e9eaee; --muted: #9ea3ad; --line: #2d3038; --bg: #131417; --accent: #a597ff;
    --head: rgba(19,20,23,.92); --seg: #24262c; --seg-on: #3a3d45; --surface: #1c1e23; --shot: #0c0d10; --chosen: #2a2748; color-scheme: dark; }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--ink); font: 14px/1.5 -apple-system, "SF Pro Text", sans-serif; }
  header { position: sticky; top: 0; z-index: 5; background: var(--head); backdrop-filter: blur(10px); border-bottom: 1px solid var(--line);
    padding: 14px 24px; display: flex; align-items: center; gap: 16px; flex-wrap: wrap; }
  h1 { font-size: 18px; margin: 0; }
  header p { margin: 0; color: var(--muted); flex: 1; min-width: 240px; }
  .seg { display: inline-flex; background: var(--seg); border-radius: 9px; padding: 3px; }
  .seg button { border: 0; background: none; padding: 5px 12px; border-radius: 7px; cursor: pointer; font: inherit; color: var(--muted); }
  .seg button.on { background: var(--seg-on); color: var(--ink); box-shadow: 0 1px 2px rgba(0,0,0,.1); }
  select { font: inherit; padding: 5px 8px; border-radius: 8px; border: 1px solid var(--line); background: var(--surface); color: var(--ink); max-width: 260px; }
  main { padding: 22px 24px 60px; display: grid; grid-template-columns: repeat(auto-fill, minmax(520px, 1fr)); gap: 22px; }
  .card { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; overflow: hidden; box-shadow: 0 1px 2px rgba(0,0,0,.04); transition: box-shadow .15s; }
  .card.chosen { outline: 3px solid var(--accent); outline-offset: -1px; }
  .shot { position: relative; aspect-ratio: 1280 / 780; overflow: hidden; background: var(--shot); border-bottom: 1px solid var(--line); }
  .shot iframe { position: absolute; left: 0; top: 0; width: 1280px; height: 780px; border: 0; transform-origin: 0 0; pointer-events: none; }
  .shot .cover { position: absolute; inset: 0; cursor: zoom-in; }
  .meta { padding: 12px 16px 14px; display: flex; gap: 12px; align-items: flex-start; }
  .num { font: 600 12px/22px -apple-system, sans-serif; color: var(--muted); min-width: 22px; }
  .meta h2 { font-size: 15px; margin: 0 0 2px; }
  .meta p { margin: 0; color: var(--muted); font-size: 13px; }
  .meta .grow { flex: 1; }
  .btns { display: flex; flex-direction: column; gap: 6px; align-items: stretch; }
  .btns button, .btns a { font: inherit; font-size: 12px; padding: 6px 12px; border-radius: 8px; border: 1px solid var(--line); background: var(--surface); color: var(--ink); cursor: pointer; text-decoration: none; text-align: center; white-space: nowrap; }
  .btns .use { background: var(--accent); border-color: var(--accent); color: #fff; }
  .card.chosen .use { background: var(--chosen); color: var(--accent); }
  @media (max-width: 600px) { main { grid-template-columns: 1fr; padding: 16px; } header { padding: 12px 16px; } }
</style>
</head>
<body>
<header>
  <h1>Pick a style</h1>
  <p>All 11 styles, live on your own paper. Click a preview to open it full size, and choose “Use this style” to make it your default. You can change it any time in ⚙ Settings.</p>
  <div class="seg" id="view"><button data-v="reader" class="on">Reader</button><button data-v="library">Library</button></div>
  <select id="paper" title="Paper to preview"></select>
  <span data-theme-switch></span>
</header>
<main id="grid"></main>
<script>
  const grid = document.getElementById("grid");
  let view = "reader", paper = "first";
  const chosen = () => { try { return JSON.parse(localStorage.getItem("pr.theme")) || "notebook"; } catch { return "notebook"; } };
  const src = (t) => view === "library" ? `/?style=${t}` : `/?style=${t}&open=${paper}`;

  function build() {
    grid.innerHTML = "";
    PR_THEMES.forEach((t, i) => {
      const card = document.createElement("div");
      card.className = "card" + (chosen() === t.id ? " chosen" : "");
      card.innerHTML = `<div class="shot"><iframe loading="lazy" src="${src(t.id)}" title="${t.name}" tabindex="-1"></iframe><a class="cover" href="${src(t.id)}" target="_blank" aria-label="Open ${t.name} full size"></a></div>
        <div class="meta"><span class="num">${String(i + 1).padStart(2, "0")}</span>
          <div class="grow"><h2>${t.name}</h2><p>${t.desc}</p></div>
          <div class="btns"><button class="use">${chosen() === t.id ? "✓ Your style" : "Use this style"}</button><a href="${src(t.id)}" target="_blank">Open ↗</a></div></div>`;
      card.querySelector(".use").onclick = () => { localStorage.setItem("pr.theme", JSON.stringify(t.id)); if (/^(dark|deco)$/.test(t.id)) ThemeSwitch.set("dark"); build(); };
      grid.appendChild(card);
    });
    fit();
  }
  function fit() {
    document.querySelectorAll(".shot").forEach((s) => { s.querySelector("iframe").style.transform = `scale(${s.clientWidth / 1280})`; });
  }
  new ResizeObserver(fit).observe(grid);
  document.getElementById("view").onclick = (e) => {
    const b = e.target.closest("button"); if (!b) return;
    view = b.dataset.v;
    document.querySelectorAll("#view button").forEach((x) => x.classList.toggle("on", x === b));
    build();
  };
  fetch("/api/papers").then((r) => r.json()).then((ps) => {
    const sel = document.getElementById("paper");
    if (!ps.length) { sel.innerHTML = "<option>No papers yet (showing the library)</option>"; sel.disabled = true; view = "library"; document.querySelector('#view [data-v="library"]').click(); return; }
    sel.innerHTML = ps.map((p) => `<option value="${p.id}">${p.title.replace(/</g, "&lt;")}</option>`).join("");
    paper = ps[0].id;
    sel.onchange = () => { paper = sel.value; build(); };
    build();
  });
</script>
<script src="/static/lifecycle-client.js"></script>
</body>
</html>
